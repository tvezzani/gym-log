  /exercises:
    get:
      operationId: listExercises
      tags:
        - Exercises
      summary: List approved, unarchived shared exercises
      description: Planned. Shared across authenticated family accounts only. Order lower(name) ASC, id ASC. Names need not be unique. This never includes other members’ pending or rejected exercises.
      security:
        - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseList'
              example:
                items:
                  - &a9
                    id: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0002
                    name: Barbell squat
                    status: approved
                    submittedBy: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0001
                    reviewedBy: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0005
                    reviewedAt: 2026-10-21T18:34:56.123Z
                    archivedAt: null
                    createdAt: 2026-10-21T18:34:56.123Z
                    updatedAt: 2026-10-21T18:34:56.123Z
                pagination: &a5
                  limit: 50
                  offset: 0
                  hasMore: false
        '401':
          description: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
