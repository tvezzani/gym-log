              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - &a6
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum returned items
        - &a7
          name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
          description: Items to skip in deterministic ordering; no snapshot guarantee across concurrent writes
    post:
      operationId: submitExercise
      tags:
        - Exercises
      summary: Submit a private pending exercise
      description: Planned. submittedBy is the session user. The submitter may use it privately while pending. Approval shares only the exercise; sets/plans remain private.
      security:
        - session: []
          csrf: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
