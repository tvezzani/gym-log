components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: gym_session
      description: Opaque secret, HttpOnly, Secure in production, SameSite=Lax; HTTPS in production. Local loopback HTTP may omit Secure. Never expose the secret in JSON.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    SetupStatus:
      type: object
      properties:
        setupRequired:
          type: boolean
      required:
        - setupRequired
      additionalProperties: false
    SetupCreate:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          description: Canonical lowercase ASCII username, 3–32 letters, digits or underscore. API username fields require this canonical form; UI may lowercase input.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12–128 characters; never trimmed or normalized. No default password.
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z_]+(?:\/[A-Za-z0-9_+.-]+)*$
          description: IANA timezone supported by the server; UTC is allowed. Stored explicitly, never changed automatically while traveling.
      required:
        - username
        - password
        - timeZone
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - PASSWORD_CHANGE_REQUIRED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - GONE
                - EXERCISE_UNAVAILABLE
                - RATE_LIMITED
                - INVALID_JSON
                - BODY_TOO_LARGE
                - UNSUPPORTED_ENCODING
                - INTERNAL_ERROR
            message:
              type: string
            fieldErrors:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
                additionalProperties: false
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          description: Canonical lowercase ASCII username, 3–32 letters, digits or underscore. API username fields require this canonical form; UI may lowercase input.
        role:
          type: string
          enum:
            - user
            - admin
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z_]+(?:\/[A-Za-z0-9_+.-]+)*$
          description: IANA timezone supported by the server; UTC is allowed. Stored explicitly, never changed automatically while traveling.
        createdAt:
