                  code: NOT_FOUND
                  message: Unknown or inaccessible resource; do not disclose another owner
        '409':
          description: State conflict; includes last active admin protection, exercise eligibility, or retry-ID conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: CONFLICT
                  message: State conflict; includes last active admin protection, exercise eligibility, or retry-ID conflict
        '413':
          description: Request body exceeds 32 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: Request body exceeds 32 KiB
        '415':
          description: Unsupported request encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNSUPPORTED_ENCODING
                  message: Unsupported request encoding
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          description: Token obtained from /auth/csrf or authenticated login response; tied to the cookie context
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must exactly match configured APP_ORIGIN. Required for browser and CLI API mutations.
  /auth/me:
    get:
      operationId: me
      tags:
        - Authentication
      summary: Read own account and CSRF token
      description: Implemented. Allowed during a required password change.
      security:
        - session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
              example: *a3
        '401':
          description: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
