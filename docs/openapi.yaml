          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: NOT_FOUND
                  message: Unknown or inaccessible resource; do not disclose another owner
        '422':
          description: Runtime validation failed; fieldErrors contain paths and messages, never input values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: *a2
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - &a6
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum returned items
        - &a7
          name: offset
          in: query
