                error:
                  code: UNAUTHENTICATED
                  message: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
        '403':
          description: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: FORBIDDEN
                  message: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
        '404':
