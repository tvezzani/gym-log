              example:
                error:
                  code: FORBIDDEN
                  message: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
        '404':
          description: Unknown or inaccessible resource; do not disclose another owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
