        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
  /auth/password:
    patch:
      operationId: changePassword
      tags:
        - Authentication
      summary: Change own password and revoke existing sessions
      description: Implemented. Verify current password; revoke all own sessions including the current one. The caller logs in again. No password/hash is returned. The new password must differ from the current password. Success clears mustChangePassword and revokes every own session.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Success; no response body
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '401':
