openapi: 3.1.0
info:
  title: Gym Log API
  version: 0.3.0
  description: The complete v1 API is implemented and verified against PostgreSQL, including authentication, accounts, exercises, independent sets and private plans. Family-private shared catalog; owner-private sets/plans. All writes require the server. API-RULES.md documents cross-field, ownership, eligibility, and concurrency rules beyond JSON Schema.
servers:
  - url: /api/v1
tags:
  - name: Operations
  - name: Authentication
  - name: Accounts
  - name: Exercises
  - name: Sets
  - name: Plans
  - name: Administration
paths:
  /health:
    get:
      operationId: health
      tags:
        - Operations
      summary: Minimal process liveness
      description: Implemented. No database details. Internal readiness uses npm run db:check.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
  /auth/csrf:
    get:
      operationId: getCsrf
      tags:
        - Authentication
      summary: Obtain a CSRF token
      description: 'Implemented. Sets an opaque signed pre-login context cookie when unauthenticated; after login returns the session CSRF token. Same-origin only; Cache-Control: no-store.'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
              example:
                csrfToken: ccccccccccccccccccccccccccccccccccccccccccc
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
  /auth/setup:
    get:
      operationId: setupStatus
      tags:
        - Authentication
      summary: Check whether first-run setup is required
      description: Implemented. Returns only setupRequired. Existing or previously configured installations with real admins remain closed even if every admin is disabled or demoted. Exact disabled development fixtures are not usable accounts. Same-origin reads only.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
              example:
                setupRequired: true
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
    post:
      operationId: setupAdmin
      tags:
        - Authentication
      summary: Create the first admin once
      description: Implemented. Same-origin and signed pre-login CSRF required. Serialized with CLI bootstrap and admin mutations. The owner chooses their final password; mustChangePassword=false. No session is issued; log in normally. Later accounts/reset/CLI bootstrap keep mandatory password changes.
      security:
        - csrf: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example: &a1
                id: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0001
                username: alex
                role: user
                isActive: true
                mustChangePassword: false
                timeZone: America/Denver
                createdAt: 2026-10-21T18:34:56.123Z
                updatedAt: 2026-10-21T18:34:56.123Z
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '403':
          description: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: FORBIDDEN
                  message: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
        '409':
          description: Setup already completed or username unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: CONFLICT
                  message: Setup already completed or username unavailable
        '413':
          description: Request body exceeds 32 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: Request body exceeds 32 KiB
        '415':
          description: Unsupported request encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNSUPPORTED_ENCODING
                  message: Unsupported request encoding
        '422':
          description: Runtime validation failed; fieldErrors contain paths and messages, never input values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: &a2
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
                  fieldErrors:
                    - path: weight
                      message: Use a decimal string with at most three decimal places
        '429':
          description: Setup rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Setup rate limit exceeded
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          description: Token obtained from /auth/csrf or authenticated login response; tied to the cookie context
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must exactly match configured APP_ORIGIN. Required for browser and CLI API mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCreate'
            example:
              username: admin
              password: Example-only-setup-password!
              timeZone: America/Denver
  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Log in and rotate the opaque session
      description: Implemented. Requires the pre-login CSRF cookie/token and same-origin check. Canonical lowercase username; password is untouched. Sets the HttpOnly session cookie; returns no session secret or hash. Sessions expire after exactly 30 days without sliding renewal. New/bootstrap/reset passwords require an immediate change; user.mustChangePassword describes this restriction.
      security:
        - csrf: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
              examples:
                normal:
                  value: &a3
                    user: *a1
                    csrfToken: ccccccccccccccccccccccccccccccccccccccccccc
                passwordChangeRequired:
                  value:
                    user:
                      id: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0001
                      username: alex
                      role: user
                      isActive: true
                      mustChangePassword: true
                      timeZone: America/Denver
                      createdAt: 2026-10-21T18:34:56.123Z
                      updatedAt: 2026-10-21T18:34:56.123Z
                    csrfToken: ccccccccccccccccccccccccccccccccccccccccccc
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '401':
          description: Invalid username/password or disabled account; use one generic message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid username/password or disabled account; use one generic message
        '403':
          description: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: FORBIDDEN
                  message: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
        '409':
          description: State conflict; includes last active admin protection, exercise eligibility, or retry-ID conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: CONFLICT
                  message: State conflict; includes last active admin protection, exercise eligibility, or retry-ID conflict
        '413':
          description: Request body exceeds 32 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: Request body exceeds 32 KiB
        '415':
          description: Unsupported request encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNSUPPORTED_ENCODING
                  message: Unsupported request encoding
        '422':
          description: Runtime validation failed; fieldErrors contain paths and messages, never input values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: *a2
        '429':
          description: Login rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Login rate limit exceeded
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          description: Token obtained from /auth/csrf or authenticated login response; tied to the cookie context
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must exactly match configured APP_ORIGIN. Required for browser and CLI API mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              username: alex
              password: Example-only-long-password!
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Revoke the current session and clear its cookie
      description: Implemented.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Success; no response body
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '401':
          description: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
        '403':
          description: Role/CSRF/origin denial, or PASSWORD_CHANGE_REQUIRED until the password is changed
          content:
            application/json:
              schema:
