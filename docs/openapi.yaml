            example:
              currentPassword: Example-only-long-password!
              newPassword: Another-example-password!
  /preferences:
    patch:
      operationId: updatePreferences
      tags:
        - Accounts
      summary: Change own explicit history timezone
      description: Implemented. A stored IANA timezone groups performed instants. Plans remain unchanged calendar dates. Never follow phone timezone changes automatically.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example: *a1
        '400':
