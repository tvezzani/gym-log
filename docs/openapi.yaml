openapi: 3.1.0
info:
  title: Gym Log API
  version: 0.1.0
  description: Milestone 2 contract. Only health is implemented so far; feature endpoints follow in milestones 3–4. Family-private shared catalog; owner-private sets/plans. All writes require the server. API-RULES.md documents cross-field, ownership, eligibility, and concurrency rules beyond JSON Schema.
servers:
  - url: /api/v1
tags:
  - name: Operations
  - name: Authentication
  - name: Accounts
  - name: Exercises
  - name: Sets
  - name: Plans
  - name: Administration
paths:
  /health:
    get:
      operationId: health
      tags:
        - Operations
      summary: Minimal process liveness
      description: Implemented. No database details. Internal readiness uses npm run db:check.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
  /auth/csrf:
    get:
      operationId: getCsrf
      tags:
        - Authentication
      summary: Obtain a CSRF token
      description: 'Planned. Sets an opaque signed pre-login context cookie when unauthenticated; after login returns the session CSRF token. Same-origin only; Cache-Control: no-store.'
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
              example:
                csrfToken: ccccccccccccccccccccccccccccccccccccccccccc
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Log in and rotate the opaque session
      description: Planned. Requires the pre-login CSRF cookie/token and same-origin check. Canonical lowercase username; password is untouched. Sets the HttpOnly session cookie; returns no session secret or hash. Session lifetime and reset policy are settled before milestone 3.
      security:
        - csrf: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
              example: &a1
                user: &a3
                  id: a3b65f0f-fc21-4fe8-81a4-bc9e1ecc0001
                  username: alex
                  role: member
                  isActive: true
                  timeZone: America/Denver
                  createdAt: 2026-10-21T18:34:56.123Z
                  updatedAt: 2026-10-21T18:34:56.123Z
                csrfToken: ccccccccccccccccccccccccccccccccccccccccccc
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '401':
          description: Invalid username/password or disabled account; use one generic message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid username/password or disabled account; use one generic message
        '403':
          description: Invalid CSRF context or origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: FORBIDDEN
                  message: Invalid CSRF context or origin
        '409':
          description: State conflict; includes last active superadmin protection, exercise eligibility, or retry-ID conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: CONFLICT
                  message: State conflict; includes last active superadmin protection, exercise eligibility, or retry-ID conflict
        '413':
          description: Request body exceeds 32 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: Request body exceeds 32 KiB
        '415':
          description: Unsupported request encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNSUPPORTED_ENCODING
                  message: Unsupported request encoding
        '422':
          description: Runtime validation failed; fieldErrors contain paths and messages, never input values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: &a2
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
                  fieldErrors:
                    - path: weight
                      message: Use a decimal string with at most three decimal places
        '429':
          description: Login rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Login rate limit exceeded
        '500':
          description: Unexpected failure; no internal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected failure; no internal details
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          description: Token obtained from /auth/csrf or authenticated login response; tied to the cookie context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              username: alex
              password: Example-only-long-password!
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Revoke the current session and clear its cookie
      description: Planned endpoint; milestone 2 defines the contract. Implementation follows in milestones 3 and 4.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Success; no response body
        '400':
          description: Malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON
        '401':
          description: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Missing, expired, revoked, or invalid session; disabled accounts cannot authenticate
        '403':
          description: Role or CSRF denial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: FORBIDDEN
                  message: Role or CSRF denial
        '404':
          description: Unknown or inaccessible resource; do not disclose another owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: NOT_FOUND
                  message: Unknown or inaccessible resource; do not disclose another owner
        '409':
          description: State conflict; includes last active superadmin protection, exercise eligibility, or retry-ID conflict
          content:
            application/json:
